name: Corpus eval

# Continuous eval for the kotlin-fhir model against the WHO smart-* corpus.
# - Tripwire: a fhir-model version newer than KNOWN_VERSION on Maven Central fails
#   the run loudly, with repro + full 31-package scan results attached.
# - Baseline: while KNOWN_VERSION is latest, the repro must still fail (it is the
#   known-broken version) and the scan is diffed against the committed baseline;
#   drift is reported in the job summary but is not a failure (corpus tips move —
#   that is WHO-side news, not a model regression).
#
# On acceptance of a new version: update KNOWN_VERSION below and commit a new
# READINESS-<ver>-baseline.md. The KM corpus census (138 PDs / 41 Measures) stays
# a local step — fhir-knowledge:2.0.0-alpha01 is mavenLocal-only.

on:
  schedule:
    - cron: '0 16 * * 1' # Mondays 16:00 UTC = 06:00 HST
  workflow_dispatch:
    inputs:
      version:
        description: 'fhir-model version to test (default: latest on Maven Central)'
        required: false

env:
  KNOWN_VERSION: 1.0.0-rc02

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve version under test
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V=$(curl -s 'https://repo1.maven.org/maven2/dev/ohs/fhir/fhir-model/maven-metadata.xml' \
              | grep -oE '<latest>[^<]+' | sed 's/<latest>//')
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$V" = "$KNOWN_VERSION" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version under test: $V (known: $KNOWN_VERSION)"

      - name: Minimal repro (kotlin-fhir#123)
        id: repro
        run: |
          set +e
          OUT=$(./gradlew -q repro -PciEval -PfhirModelVersion="${{ steps.ver.outputs.version }}" 2>&1)
          if echo "$OUT" | grep -q 'Parsed: PlanDefinition'; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          fi
          echo "repro: $(grep -q 'Parsed: PlanDefinition' <<<"$OUT" && echo PASS || echo FAIL)"

      - name: Fetch WHO smart-* corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./fetch-corpus.sh

      - name: Run 31-package scan
        run: ./gradlew -q scan -PciEval -PfhirModelVersion="${{ steps.ver.outputs.version }}"

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ steps.ver.outputs.version }}
          path: |
            READINESS.md
            scan-results.json
            corpus-scan/manifest.tsv

      - name: Report
        run: |
          V="${{ steps.ver.outputs.version }}"
          REPRO="${{ steps.repro.outputs.result }}"
          {
            echo "## Corpus eval — fhir-model:$V"
            echo ""
            echo "- text/cql-identifier repro: **$REPRO**"
            echo ""
            echo "### Scan headline"
            sed -n '/^## Headline/,/^## Matrix/p' READINESS.md | head -20
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.ver.outputs.new }}" = "true" ]; then
            {
              echo ""
              echo "## :rotating_light: NEW fhir-model VERSION: $V"
              echo "Failing deliberately so this gets seen. Next steps (local):"
              echo '1. `./accept-123.sh '"$V"'` (full KM census — needs mavenLocal fhir-knowledge)'
              echo "2. Review the attached READINESS.md against the rc02 baseline"
              echo "3. Update KNOWN_VERSION in this workflow + commit new baseline"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Baseline path: rc02 is immutable, so the repro must still FAIL on it.
          if [ "$REPRO" = "PASS" ]; then
            echo "::error::repro unexpectedly PASSED on known-broken $V — eval assumptions broken"
            exit 1
          fi

          # Corpus drift vs committed baseline: warn, don't fail.
          if ! diff -q READINESS-rc02-baseline.md READINESS.md > /dev/null 2>&1; then
            {
              echo ""
              echo "### :warning: Scan drifted from committed rc02 baseline (corpus-side change)"
              echo '```diff'
              diff READINESS-rc02-baseline.md READINESS.md | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Scan matches committed rc02 baseline exactly." >> "$GITHUB_STEP_SUMMARY"
          fi
